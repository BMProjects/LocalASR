[models.qwen3-asr-0_6b-q8]
# 2401 MiB measured on the Orin, headless, cold page cache (weights 971 MiB, 2.47x).
# An earlier reading of 1551 was taken while the desktop session was up and another
# model was already resident; under that pressure the kernel simply had less to hand
# back, and the number flattered the model. Measure on an idle machine or not at all.
measured_mb = 2401
