# --- refinement (kind = "llm") ------------------------------------------------
#
# A second role, not a second ASR model: this one tidies transcripts and never sees
# audio. It is listed here so it inherits the same pinning discipline — revision,
# sha256 and size — as everything else.
#
# Q4_K_M rather than the official repo's Q8_0 (1.83 GB): on 8 GB of *unified* memory
# the refiner shares a pool with the ASR model, the desktop and the page cache, so the
# 0.7 GB saved is the difference between sequential loading being comfortable and being
# a swap storm. The quantisation comes from unsloth because the official GGUF repo
# publishes Q8_0 only; pinning the revision and hash is what makes that acceptable.

# Qwen3.5-4B is the model to try, per the current plan. The unsloth quantisation is
# listed rather than bartowski's because it is 260 MiB smaller for the same Q4_K_M
# recipe, and on a device where the guard is the binding constraint that difference is
# the whole margin. No `mmproj`: refinement only ever sees text.
#
# Read the memory note below before assuming this one loads.
[models.qwen3_5-4b-refiner-q4]
# 3876 MiB measured on the Orin at -c 4096, headless, cold page cache
# (weights 2613 MiB, 1.48x). An earlier 3365 came from a loaded machine; see the note
# on the 0.6B entry.
measured_mb = 3876
runtime = "llama-server"
kind = "llm"
repo = "unsloth/Qwen3.5-4B-GGUF"
revision = "e87f176479d0855a907a41277aca2f8ee7a09523"
ctx_size = 4096
default = true

[models.qwen3_5-4b-refiner-q4.files.model]
name = "Qwen3.5-4B-Q4_K_M.gguf"
sha256 = "00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4"
size = 2740937888


# The refiner that lets both roles stay resident. 2108 MiB measured on the Orin,
# headless, cold page cache (weights 1221 MiB, 1.73x) against the 4B's 3876 — and
# 1.7B ASR + 2B refiner is 5899 MiB, which fits the 6903 MiB headless budget with room
# to spare. unsloth's quantisation is 115 MiB smaller than bartowski's for the same
# Q4_K_M recipe. No mmproj: refinement only ever sees text.
[models.qwen3_5-2b-refiner-q4]
measured_mb = 2108
runtime = "llama-server"
kind = "llm"
repo = "unsloth/Qwen3.5-2B-GGUF"
revision = "f6d5376be1edb4d416d56da11e5397a961aca8ae"
ctx_size = 4096
