# Declarative model catalog.
#
# Adding a model the runtime already supports is a config change, not a code change.
# `runtime` selects which supervisor launches it; `llama-server` covers the audio
# models in llama.cpp's multimodal support.
#
# Every file is pinned by repository revision, sha256 and size, and downloads are
# verified before use. `resolve/main` is a moving target: the same URL can serve a
# different graph after an upstream push, which for a VAD or an ASR model changes
# results silently rather than failing. Files land in
# models/<model_id>/<revision>/<filename> so two models can share a filename.
#
# Resource cost is deliberately absent here — it depends on hardware, driver, backend
# and launch flags, so it belongs to a per-machine profile (see profile.py), not to a
# catalog shared across machines.

[runtime.llama-server]
# llama.cpp's audio support is upstream-flagged as experimental, so the builds whose
# behaviour has actually been exercised are listed rather than assumed. Anything not
# here still runs; it only warns.
#
#   b10333  the x86_64 Vulkan release the desktop uses
#   b300    built from commit 153d324bcf86d220b235ca010eeb11213f32b5d1 on the Jetson
#           Orin Nano Super (CUDA sm87) and measured there with Qwen3.5-4B
#
# One list, not a verified build plus a commit nobody reads: the second was decoration,
# and the machine it described was warning about a mismatch on every start.
verified_builds = ["b10333", "b300"]
release_url = "https://github.com/ggml-org/llama.cpp/releases"

[models.qwen3-asr-1_7b-q8]
# 3964 MiB measured on the Orin, headless, cold page cache (weights 2403 MiB, 1.65x).
# The 1.4x fallback would have under-counted this by 600 MiB, which is the whole margin
# on an 8 GB board — the reason measured values beat any single multiplier.
# 3964 MiB measured alone on an idle machine with a cold page cache; 3791 MiB when
# loaded second, beside an already-running refiner. The larger figure is kept because a
# guard that under-counts is the expensive kind of wrong — but note that summing two
# such figures over-states a pair by ~170 MiB, since some cost (CUDA context, shared
# library pages) is paid once rather than twice.
measured_mb = 3964
runtime = "llama-server"
repo = "ggml-org/Qwen3-ASR-1.7B-GGUF"
revision = "36a678687ba7d07a74ca70ccb0e36902e005fb80"
ctx_size = 4096
default = true

[models.qwen3-asr-1_7b-q8.files.model]
name = "Qwen3-ASR-1.7B-Q8_0.gguf"
sha256 = "58e22d0532d4eacaf034cfac17a6fed159f37c41390c710186783be439d1fc57"
size = 2165034944

[models.qwen3-asr-1_7b-q8.files.mmproj]
